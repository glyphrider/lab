---
# Hosts whose Python is too old for the controller's ansible-core (bionic,
# focal) can't run modules or gather facts; they get a raw-only install.
- name: Install node_exporter with Python modules
  ansible.builtin.include_tasks: install.yml
  when: not (node_exporter_use_raw | default(false))

- name: Install node_exporter with raw commands
  ansible.builtin.include_tasks: raw.yml
  when: node_exporter_use_raw | default(false)
