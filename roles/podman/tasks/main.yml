---
- name: Ensure podman and podman-compose are installed
  ansible.builtin.package:
    name:
      - podman
      - podman-compose
    state: present

- name: Create containers firewall zone
  ansible.builtin.command: firewall-cmd --permanent --new-zone=containers
  register: _zone_create
  changed_when: _zone_create.rc == 0
  failed_when: _zone_create.rc != 0 and 'NAME_CONFLICT' not in _zone_create.stderr
  when: ansible_facts['os_family'] == 'RedHat'

- name: Configure containers zone
  ansible.builtin.command: firewall-cmd --permanent --zone=containers {{ item }}
  loop:
    - --add-forward
  notify: Reload firewalld
  when: ansible_facts['os_family'] == 'RedHat'

- name: Assign jellyfin bridge to containers zone
  ansible.builtin.command: >
    firewall-cmd --permanent --zone=containers --add-interface=jellyfin-br0
  register: _iface
  changed_when: _iface.rc == 0
  failed_when: _iface.rc != 0 and 'ZONE_ALREADY_SET' not in _iface.stderr
  notify: Reload firewalld
  when: ansible_facts['os_family'] == 'RedHat'

- name: Create containers-to-inet firewall policy
  ansible.builtin.command: firewall-cmd --permanent --new-policy=containers-to-inet
  register: _policy_create
  changed_when: _policy_create.rc == 0
  failed_when: _policy_create.rc != 0 and 'NAME_CONFLICT' not in _policy_create.stderr
  when: ansible_facts['os_family'] == 'RedHat'

- name: Configure containers-to-inet policy
  ansible.builtin.command: firewall-cmd --permanent --policy=containers-to-inet {{ item }}
  loop:
    - --add-ingress-zone=containers
    - --add-egress-zone=FedoraServer
    - --add-masquerade
    - --set-target=ACCEPT
  notify: Reload firewalld
  when: ansible_facts['os_family'] == 'RedHat'

- name: Configure container registries
  ansible.builtin.copy:
    dest: /etc/containers/registries.conf.d/docker-io.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [[registry]]
      location = "docker.io"
