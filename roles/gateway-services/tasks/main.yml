---
- name: Deploy ntpd.conf
  ansible.builtin.copy:
    src: ntpd.conf
    dest: /etc/ntpd.conf
    owner: root
    group: wheel
    mode: '0644'
  notify: Restart ntpd

- name: Enable ntpd
  ansible.builtin.lineinfile:
    path: /etc/rc.conf.local
    line: ntpd_flags="-s"
    regexp: '^ntpd_flags='
    create: true
    owner: root
    group: wheel
    mode: '0644'
  notify: Restart ntpd

- name: Enable remote syslog reception
  ansible.builtin.lineinfile:
    path: /etc/rc.conf.local
    line: syslogd_flags="-u -a 192.168.1.0/24:*"
    regexp: '^syslogd_flags='
    create: true
    owner: root
    group: wheel
    mode: '0644'
  notify: Restart syslogd

# OpenBSD syslogd does not create missing log files; it silently skips the
# action, so the file must exist before syslogd is (re)started.
- name: Create switch log file
  ansible.builtin.file:
    path: /var/log/switch.log
    state: touch
    owner: root
    group: wheel
    mode: '0640'
    modification_time: preserve
    access_time: preserve
  notify: Restart syslogd

# Rotate weekly (Sunday midnight) or at 1 MB, keeping 8 compressed archives.
# newsyslog HUPs syslogd after rotating, so no restart command is needed.
- name: Rotate switch log
  ansible.builtin.lineinfile:
    path: /etc/newsyslog.conf
    line: "/var/log/switch.log\t\troot:wheel\t640  8     1000 $W0   Z"
    regexp: '^/var/log/switch\.log\s'

- name: Route switch logs to dedicated file
  ansible.builtin.blockinfile:
    path: /etc/syslog.conf
    block: |
      +switch
      *.*  /var/log/switch.log
      +*
    marker: "# {mark} ANSIBLE MANAGED - switch syslog"
  notify: Restart syslogd

# Blank the console after idle (screen_off is in milliseconds; 0 disables).
# vblank=on asks inteldrm for a DPMS suspend rather than a normal blank.
#
# Monitor requirement: the attached MSI G242 must have OSD Setting > Auto Scan
# OFF. With Auto Scan on, losing the DP signal makes the monitor re-scan inputs,
# which the GPU sees as a hotplug; the fb console then re-lights the screen
# while wscons still believes it is blanked, so it never blanks again until a
# key is pressed.
- name: Persist console blanking settings
  ansible.builtin.lineinfile:
    path: /etc/wsconsctl.conf
    line: "{{ item.key }}={{ item.value }}"
    regexp: '^{{ item.key | regex_escape }}='
    create: true
    owner: root
    group: wheel
    mode: '0644'
  loop: "{{ _console_blank_settings | dict2items }}"
  vars:
    _console_blank_settings:
      display.screen_off: "{{ gateway_console_blank_ms }}"
      display.vblank: "on"
  register: gateway_console_blank

- name: Apply console blanking settings now
  ansible.builtin.command: wsconsctl {{ item.item.key }}={{ item.item.value }}
  loop: "{{ gateway_console_blank.results | selectattr('changed') | list }}"
  loop_control:
    label: "{{ item.item.key }}"
  changed_when: true
