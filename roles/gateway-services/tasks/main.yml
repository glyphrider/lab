---
- name: Deploy ntpd.conf
  ansible.builtin.copy:
    src: ntpd.conf
    dest: /etc/ntpd.conf
    owner: root
    group: wheel
    mode: '0644'
  notify: Restart ntpd

- name: Enable ntpd
  ansible.builtin.lineinfile:
    path: /etc/rc.conf.local
    line: ntpd_flags="-s"
    regexp: '^ntpd_flags='
    create: true
    owner: root
    group: wheel
    mode: '0644'
  notify: Restart ntpd

- name: Enable remote syslog reception
  ansible.builtin.lineinfile:
    path: /etc/rc.conf.local
    line: syslogd_flags="-u -a 192.168.1.0/24:*"
    regexp: '^syslogd_flags='
    create: true
    owner: root
    group: wheel
    mode: '0644'
  notify: Restart syslogd

# OpenBSD syslogd does not create missing log files; it silently skips the
# action, so the file must exist before syslogd is (re)started.
- name: Create switch log file
  ansible.builtin.file:
    path: /var/log/switch.log
    state: touch
    owner: root
    group: wheel
    mode: '0640'
    modification_time: preserve
    access_time: preserve
  notify: Restart syslogd

- name: Route switch logs to dedicated file
  ansible.builtin.blockinfile:
    path: /etc/syslog.conf
    block: |
      +switch
      *.*  /var/log/switch.log
      +*
    marker: "# {mark} ANSIBLE MANAGED - switch syslog"
  notify: Restart syslogd

# Blank the console after 5 minutes idle (value is in milliseconds; 0 disables).
- name: Persist console blanking timeout
  ansible.builtin.lineinfile:
    path: /etc/wsconsctl.conf
    line: display.screen_off={{ gateway_console_blank_ms }}
    regexp: '^display\.screen_off='
    create: true
    owner: root
    group: wheel
    mode: '0644'
  register: gateway_console_blank

- name: Apply console blanking timeout now
  ansible.builtin.command: wsconsctl display.screen_off={{ gateway_console_blank_ms }}
  when: gateway_console_blank.changed
  changed_when: true
