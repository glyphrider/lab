---
# ── CA certificate ────────────────────────────────────────────────────────────

- name: Install marisol CA certificate
  ansible.builtin.copy:
    src: marisol.crt
    dest: /usr/local/share/ca-certificates/marisol.crt
    owner: root
    group: root
    mode: '0644'
  notify: Update CA certificates

# ── System updates ────────────────────────────────────────────────────────────

- name: Upgrade all packages
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true

- name: Check if reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: _reboot_required_file

- name: Reboot if required
  ansible.builtin.reboot:
    msg: Rebooting after package updates
    pre_reboot_delay: 5
    post_reboot_delay: 30
    connect_timeout: 10
    reboot_timeout: 300
  when: _reboot_required_file.stat.exists

# ── Prerequisites & install ───────────────────────────────────────────────────

- name: Install UniFi OS prerequisites
  ansible.builtin.apt:
    name: "{{ unifi_prerequisites }}"
    state: present
    update_cache: true

- name: Copy UniFi OS Server installer
  ansible.builtin.copy:
    src: "{{ unifi_os_installer }}"
    dest: "/root/{{ unifi_os_installer }}"
    mode: '0755'
  register: _unifi_installer_copy

- name: Run UniFi OS Server installer
  ansible.builtin.shell: "echo 'y' | /root/{{ unifi_os_installer }}"
  when: _unifi_installer_copy.changed

# ── Certificate ───────────────────────────────────────────────────────────────

# Staged in a persistent directory (not /tmp) so a reboot doesn't make the
# copy look changed and trigger a needless container restart.  Must be
# readable by uosserver, since podman cp runs as that user.

- name: Create certificate staging directory
  ansible.builtin.file:
    path: "{{ unifi_cert_dir }}"
    state: directory
    owner: uosserver
    group: uosserver
    mode: '0700'

- name: Copy certificate files to VM
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ unifi_cert_dir }}/{{ item.dest }}"
    owner: uosserver
    group: uosserver
    mode: "{{ item.mode }}"
  loop:
    - { src: unifi.crt, dest: unifi-core.crt, mode: '0644' }
    - { src: unifi.key, dest: unifi-core.key, mode: '0600' }
  register: _certs

- name: Copy certificate into container
  ansible.builtin.command: "sudo -u uosserver podman cp {{ unifi_cert_dir }}/{{ item }} uosserver:/data/unifi-core/config/{{ item }}"
  args:
    chdir: "{{ unifi_cert_dir }}"
  loop:
    - unifi-core.crt
    - unifi-core.key
  when: _certs.changed

- name: Restart uosserver container
  ansible.builtin.command: sudo -u uosserver podman restart uosserver
  args:
    chdir: "{{ unifi_cert_dir }}"
  when: _certs.changed
