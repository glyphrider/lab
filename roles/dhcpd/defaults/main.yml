---
dhcpd_default_lease_time: 300
dhcpd_max_lease_time:     604800
dhcpd_domain_name:        marisol.home

# Host reservations come from unbound_views[].records (mac field) and
# dhcp_only_hosts, keyed by view/vlan — see group_vars/all/vars.yml.
dhcpd_subnets:

  - subnet:  192.168.1.0
    netmask: 255.255.255.0
    range:   [192.168.1.65,  192.168.1.192]
    routers: 192.168.1.1
    dns:     [192.168.1.5, 192.168.1.251]
    view:    management

  - subnet:  10.47.2.0
    netmask: 255.255.255.0
    range:   [10.47.2.33, 10.47.2.192]
    routers: 10.47.2.1
    dns:     [10.47.2.5, 10.47.2.251]
    view:    marisol

  - subnet:  10.47.3.0
    netmask: 255.255.255.0
    range:   [10.47.3.17, 10.47.3.248]
    routers: 10.47.3.1
    dns:     [10.47.3.5, 10.47.3.251]
    view:    iot

  - subnet:  10.47.4.0
    netmask: 255.255.255.0
    range:   [10.47.4.17, 10.47.4.248]
    routers: 10.47.4.1
    dns:     [10.47.4.1]
    view:    work
