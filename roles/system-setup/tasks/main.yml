---
# ── CA certificate ────────────────────────────────────────────────────────────

- name: Install marisol CA certificate (Red Hat)
  ansible.builtin.copy:
    src: marisol.crt
    dest: /etc/pki/ca-trust/source/anchors/marisol.crt
    owner: root
    group: root
    mode: '0644'
  notify: Update CA trust (Red Hat)
  when: ansible_facts['os_family'] == 'RedHat'

- name: Install marisol CA certificate (Debian)
  ansible.builtin.copy:
    src: marisol.crt
    dest: /usr/local/share/ca-certificates/marisol.crt
    owner: root
    group: root
    mode: '0644'
  notify: Update CA trust (Debian)
  when: ansible_facts['os_family'] == 'Debian'

# ── Power-on after AC loss (Mac mini) ─────────────────────────────────────────
# Clears AFTERG3_EN (bit 0 of GEN_PMCON_3 on the LPC bridge) so the machine
# powers on when AC is restored. Reapplied at every boot because the value can
# be lost after power events.

- name: Deploy power-on-after-AC-loss service
  ansible.builtin.copy:
    dest: /etc/systemd/system/mac-power-on.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Power on after AC loss (Mac mini)

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/setpci -s 00:1f.0 0xa4.b=0

      [Install]
      WantedBy=multi-user.target
  register: _mac_power_on_unit
  when: ansible_facts['os_family'] == 'RedHat'

- name: Enable and start power-on-after-AC-loss service
  ansible.builtin.systemd:
    name: mac-power-on.service
    enabled: true
    state: started
    daemon_reload: "{{ _mac_power_on_unit is changed }}"
  when: ansible_facts['os_family'] == 'RedHat'

# ── Package updates ───────────────────────────────────────────────────────────

- name: Update all packages (Red Hat)
  ansible.builtin.dnf:
    name: '*'
    state: latest
  when: ansible_facts['os_family'] == 'RedHat'

- name: Update all packages (Debian)
  ansible.builtin.apt:
    upgrade: dist
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

# ── Conditional reboot ────────────────────────────────────────────────────────

- name: Check if reboot is required (Red Hat)
  ansible.builtin.command: needs-restarting -r
  register: _reboot_check
  changed_when: false
  failed_when: false
  when: ansible_facts['os_family'] == 'RedHat'

- name: Check if reboot is required (Debian)
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: _reboot_required_file
  when: ansible_facts['os_family'] == 'Debian'

- name: Reboot if required (Red Hat)
  ansible.builtin.reboot:
    msg: Rebooting after package updates
    pre_reboot_delay: 5
    post_reboot_delay: 30
    connect_timeout: 10
    reboot_timeout: 300
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - _reboot_check.rc == 1

- name: Reboot if required (Debian)
  ansible.builtin.reboot:
    msg: Rebooting after package updates
    pre_reboot_delay: 5
    post_reboot_delay: 30
    connect_timeout: 10
    reboot_timeout: 300
  when:
    - ansible_facts['os_family'] == 'Debian'
    - _reboot_required_file.stat.exists
