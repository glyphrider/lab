---
ansible_user: brian
ansible_become_method: sudo

unbound_local_zone: marisol.home

unbound_access_control:
  - { subnet: 127.0.0.0/8,    action: allow }
  - { subnet: 192.168.1.0/24, action: allow }
  - { subnet: 10.47.2.0/24,   action: allow }
  - { subnet: 10.47.3.0/24,   action: allow }
  - { subnet: 10.47.4.0/24,   action: allow }
  - { subnet: 0.0.0.0/0,      action: refuse }

# `mac` on a record is optional and only consumed by the dhcpd role, to
# generate a matching static reservation — it's ignored by unbound. Hosts
# that need a reservation but no DNS record go in dhcp_only_hosts below.
unbound_views:
  - name: management
    clients:
      - 127.0.0.0/8
      - 192.168.1.0/24
    records:
      - { name: gateway,    ip: 192.168.1.1   }
      - { name: unifi,      ip: 192.168.1.2   } # static via cloud-init, no DHCP reservation
      - { name: lab,        ip: 192.168.1.3,   mac: "a8:20:66:12:44:60" }
      - { name: nas,        ip: 192.168.1.4,   mac: "a0:d3:c1:20:d9:8a" }
      - { name: pihole,     ip: 192.168.1.5,   mac: "dc:a6:32:69:66:ed" }
      - { name: office,     ip: 192.168.1.14,  mac: "f4:92:bf:69:41:ee" }
      - { name: sunroom,    ip: 192.168.1.16,  mac: "74:83:c2:02:7d:aa" }
      - { name: library,    ip: 192.168.1.18,  mac: "f4:92:bf:69:45:d8" }
      - { name: cottingly,  ip: 192.168.1.20,  mac: "e0:63:da:7c:03:5f" }
      - { name: rhel8,      ip: 192.168.1.35,  mac: "52:54:00:aa:74:f7" }
      - { name: rhel9,      ip: 192.168.1.36,  mac: "52:54:00:6c:6e:a0" }
      - { name: ol9,        ip: 192.168.1.39,  mac: "52:54:00:40:66:71" }
      - { name: switch,     ip: 192.168.1.253 }
      - { name: pihole2,    ip: 192.168.1.251, mac: "dc:a6:32:d0:9c:a6" }
      - { name: beast,      ip: 192.168.1.21,  mac: "d6:07:e1:c7:1b:f6" }
      - { name: jellyfin,   ip: 10.47.2.6     } # cross-vlan alias; reservation lives on the marisol record
      - { name: grafana,    ip: 192.168.1.7   }
      - { name: prometheus, ip: 192.168.1.8   }

  - name: marisol
    clients:
      - 10.47.2.0/24
    records:
      - { name: gateway,  ip: 10.47.2.1   }
      - { name: pihole,   ip: 10.47.2.5,   mac: "dc:a6:32:69:66:ed" }
      - { name: jellyfin, ip: 10.47.2.6,   mac: "00:16:3E:91:31:07" }
      - { name: pihole2,  ip: 10.47.2.251 }
      - { name: beast,    ip: 10.47.2.21,  mac: "52:8f:0f:7b:9b:b0" }
      - { name: et8550,   ip: 10.47.2.18,  mac: "d4:80:8b:a8:06:de" }
      - { name: et2803,   ip: 10.47.2.19,  mac: "a4:d7:3c:26:bc:d2" }
      - { name: et2903,   ip: 10.47.2.20,  mac: "58:05:d9:59:ea:58" }

  - name: iot
    clients:
      - 10.47.3.0/24
    records:
      - { name: gateway, ip: 10.47.3.1   }
      - { name: pihole,  ip: 10.47.3.5,   mac: "dc:a6:32:69:66:ed" }
      - { name: pihole2, ip: 10.47.3.251 }

  - name: work
    clients:
      - 10.47.4.0/24
    records:
      - { name: gateway, ip: 10.47.4.1 }

# DHCP reservations for hosts with no DNS record (test/template VMs, printers,
# phones, etc). Keyed by the same view name used above, since dhcpd subnets
# map 1:1 to unbound views.
dhcp_only_hosts:
  management:
    - { name: freebsd,  mac: "52:54:00:c7:06:42", ip: 192.168.1.32 }
    - { name: netbsd,   mac: "52:54:00:92:ca:ac", ip: 192.168.1.33 }
    - { name: openbsd,  mac: "52:54:00:88:45:ec", ip: 192.168.1.34 }
    - { name: rhel10,   mac: "52:54:00:58:bd:88", ip: 192.168.1.37 }
    - { name: oracle8,  mac: "52:54:00:8f:88:98", ip: 192.168.1.38 }
    - { name: oracle10, mac: "52:54:00:32:73:37", ip: 192.168.1.40 }
    - { name: bionic,   mac: "52:54:00:47:71:10", ip: 192.168.1.41 }
    - { name: focal,    mac: "52:54:00:47:71:11", ip: 192.168.1.42 }
    - { name: jammy,    mac: "52:54:00:47:71:12", ip: 192.168.1.43 }
    - { name: noble,    mac: "52:54:00:47:71:13", ip: 192.168.1.44 }
    - { name: torrent,  mac: "52:54:00:70:1f:35", ip: 192.168.1.63 }
  marisol:
    - { name: piBSD,    mac: "dc:a6:32:d0:9c:a6", ip: 10.47.2.10 }
    - { name: pinetbsd, mac: "dc:a6:32:d0:9c:a7", ip: 10.47.2.17 }
  iot: []
  work:
    - { name: bward-mbp, mac: "6e:14:68:85:47:c6", ip: 10.47.4.8 }
    - { name: iphone,    mac: "7a:f1:ec:bc:34:9b", ip: 10.47.4.9 }
